name: Extract uploaded ZIP into repository

on:
  push:
    branches:
      - main
    paths:
      - "tiksave-pro.zip"
      - ".github/workflows/extract-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether ZIP exists
        id: zip
        shell: bash
        run: |
          if [ -f "tiksave-pro.zip" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ZIP is absent (likely already extracted and deleted); nothing to do."
          fi

      - name: Extract ZIP safely
        if: steps.zip.outputs.exists == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("tiksave-pro.zip")
          root = Path(".").resolve()
          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path rejected: {info.filename}")
                  if name == ".git" or name.startswith(".git/"):
                      continue
                  if name == ".github/workflows" or name.startswith(".github/workflows/"):
                      continue
                  zf.extract(info, root)

          print("ZIP extraction completed.")
          PY

      - name: Delete uploaded ZIP
        if: steps.zip.outputs.exists == 'true'
        run: rm -f tiksave-pro.zip

      - name: Commit extracted files and ZIP deletion
        if: steps.zip.outputs.exists == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract project files and remove uploaded ZIP"
            git push
          fi
