name: Extract uploaded ZIP into repository

on:
  push:
    branches:
      - main
    paths:
      - "tiksave-pro.zip"
      - ".github/workflows/extract-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os

          archive = Path("tiksave-pro.zip")
          if not archive.is_file():
              raise SystemExit("tiksave-pro.zip was not found in the repository root.")

          root = Path(".").resolve()
          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path rejected: {info.filename}")
                  if name.startswith(".git/") or name == ".git":
                      continue
                  if name.startswith(".github/workflows/"):
                      continue
                  zf.extract(info, root)

          print("ZIP extraction completed.")
          PY

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract project files from tiksave-pro.zip"
            git push
          fi
