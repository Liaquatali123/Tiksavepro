name: TikSave Pro CI

on:
  push:
    branches: [main]
    paths:
      - "tiksave-pro/**"
      - ".github/workflows/tiksave-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "tiksave-pro/**"
      - ".github/workflows/tiksave-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiksave-pro
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tiksave-pro/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          RAPIDAPI_KEY: ci-placeholder-not-a-real-key
          RAPIDAPI_HOST: tiktok-video-no-watermark2.p.rapidapi.com
          NEXT_PUBLIC_SITE_URL: https://tiksavepro.vercel.app
